services:
  app:
    build:
      context: ..
      dockerfile: ./docker/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - db
    environment:
      - RAILS_ENV=development
      - DATABASE_HOST=db
      - DATABASE_USERNAME=cdbusr
      - DATABASE_PASSWORD=ei9vDmJN
      - DATABASE_NAME=cdb_dev
      - LOAD_SAMPLE_DATA=true
    volumes:
      - ..:/app
      - /app/node_modules
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec rails s -p 3000 -b '0.0.0.0'"

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: cdb_dev
      MYSQL_USER: cdbusr
      MYSQL_PASSWORD: ei9vDmJN
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
