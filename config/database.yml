# SQLite version 3.x
#   gem install sqlite3-ruby (not necessary on OS X Leopard)
development:
  adapter: mysql2
  encoding: utf8
  database: <%= ENV.fetch('DATABASE_NAME') { Rails.application.credentials.dig(:database, :development, :db_name) } %>
  pool: 5
  username: <%= ENV.fetch('DATABASE_USERNAME') { Rails.application.credentials.dig(:database, :development, :username) } %>
  password: <%= ENV.fetch('DATABASE_PASSWORD') { Rails.application.credentials.dig(:database, :development, :password) } %>
  host: <%= ENV.fetch('DATABASE_HOST') { 'localhost' } %>

test:
  adapter: mysql2
  encoding: utf8
  reconnect: true
  database: <%= ENV.fetch('DATABASE_NAME_TEST') { Rails.application.credentials.dig(:database, :test, :db_name) } %>
  pool: 5
  username: <%= ENV.fetch('DATABASE_USERNAME') { Rails.application.credentials.dig(:database, :test, :username) } %>
  password: <%= ENV.fetch('DATABASE_PASSWORD') { Rails.application.credentials.dig(:database, :test, :password) } %>
  host: <%= ENV.fetch('DATABASE_HOST') { 'localhost' } %>

production:
  adapter: mysql2
  encoding: utf8
  reconnect: true
  database: <%= Rails.application.credentials.dig(:database, :production, :db_name) %>
  pool: 5
  username: <%= Rails.application.credentials.dig(:database, :production, :username) %>
  password: <%= Rails.application.credentials.dig(:database, :production, :password) %>
